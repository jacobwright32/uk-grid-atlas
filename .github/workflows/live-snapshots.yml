name: Refresh live snapshots

on:
  schedule:
    - cron: '17 */6 * * *' # every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to dispatch the Pages deploy after a snapshot commit

concurrency:
  group: live-snapshots
  cancel-in-progress: true

# Two jobs, not one: runs #126–131 (22–23 Aug) each spent the whole 45-minute
# budget inside the ENTSO-E step (ban waits stack up to 15 min each), so the
# job-level timeout cancelled the run mid-step — the `|| echo` fallback never
# fired, and the ca/us/gb fetches queued BEHIND the wedge never ran at all.
# Six runs in a row committed nothing. The key-less fetchers now land first in
# their own quick job, and the ENTSO-E bake polices its own time budget so it
# exits (partial, committable) instead of being killed.
jobs:
  # ~2–3 min all-in. Must never wait behind a banned ENTSO-E tail.
  fast-grids:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Same partial-success rule throughout: one failed source must not
      # discard the others (it cost 10 h of staleness on 3 Aug when a single
      # timeout marked the whole run failed).
      - name: Fetch Canada snapshot (IESO, key-less)
        run: node scripts/fetch-ca-snapshot.mjs || echo "IESO fetch failed — keeping previous ca.json"
      - name: Fetch US snapshot (ERCOT + NYISO, key-less)
        run: node scripts/fetch-us-snapshot.mjs || echo "US fetch failed — keeping previous us.json"
      - name: Fetch GB history (Elexon, key-less)
        run: node scripts/fetch-gb-history.mjs || echo "GB history fetch failed — keeping previous gb.json"
      # Coverage surface (#96): restate what the freshly-baked files actually
      # contain — the sidebar block and weg.coverage() both read this.
      - name: Rebuild coverage.json
        run: node scripts/build-coverage.mjs
      - name: Commit refreshed snapshots
        id: commit
        run: |
          git config user.name "grid-atlas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/live || true
          if git diff --cached --quiet; then
            echo "No snapshot changes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: refresh ca/us/gb live snapshots"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      # Pushes made with GITHUB_TOKEN don't fire `on: push` workflows, so the
      # site would never pick up refreshed snapshots — dispatch the deploy.
      - name: Trigger site deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

  # Sequenced after fast-grids (never in parallel with it) so its checkout
  # already contains the fast commit and the two jobs can't race a push.
  # `!cancelled()` lets it run even if fast-grids failed — European snapshots
  # must not depend on Elexon or IESO being up.
  entsoe:
    needs: fast-grids
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Backstop only. The script's own --deadline-minutes budget below is what
    # actually bounds the run; it fires first, exits cleanly, and leaves time
    # for coverage + commit. If THIS timeout ever fires something new is wedged.
    timeout-minutes: 44
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # --deadline-minutes 35: once spent, the client refuses further ban
      # waits and remaining grids are skipped (they catch up next run). The
      # script exits non-zero → the fallback fires → whatever DID refresh is
      # committed below. 35 + one in-flight grid + npm ci stays inside 44.
      - name: Fetch ENTSO-E snapshots
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: node scripts/fetch-entsoe-snapshot.mjs all --deadline-minutes 35 || echo "partial bake - committing what refreshed"
      - name: Rebuild coverage.json
        run: node scripts/build-coverage.mjs
      - name: Commit refreshed snapshots
        id: commit
        run: |
          git config user.name "grid-atlas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/live data/entsoe-maps || true
          if git diff --cached --quiet; then
            echo "No snapshot changes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: refresh European live snapshots"
            # An intraday tick may push mid-bake. The bake's snapshots are a
            # full refresh and strictly fresher than the tick's today-block
            # patch, so on a race, replay our commit on top and keep our
            # version of any conflicting file (-X theirs = ours-being-rebased).
            if ! git push; then
              git pull --rebase -X theirs origin main
              git push
            fi
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger site deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
