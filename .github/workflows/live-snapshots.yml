name: Refresh live snapshots

on:
  schedule:
    - cron: '17 */6 * * *' # every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to dispatch the Pages deploy after a snapshot commit

concurrency:
  group: live-snapshots
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A wedged retry-tail (ENTSO-E ban waits stack up to 15 min each) must not
    # ride to GitHub's 6-hour default and block the next scheduled run.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch ENTSO-E snapshots
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        # Same partial-success rule as the ca/us/gb steps below: one failed
        # grid must not discard the other 28 (it cost 10 h of staleness on
        # 3 Aug when a single timeout marked the whole run failed).
        run: node scripts/fetch-entsoe-snapshot.mjs all || echo "partial bake - committing what refreshed"
      - name: Fetch Canada snapshot (IESO, key-less)
        run: node scripts/fetch-ca-snapshot.mjs || echo "IESO fetch failed — keeping previous ca.json"
      - name: Fetch US snapshot (ERCOT + NYISO, key-less)
        run: node scripts/fetch-us-snapshot.mjs || echo "US fetch failed — keeping previous us.json"
      - name: Fetch GB history (Elexon, key-less)
        run: node scripts/fetch-gb-history.mjs || echo "GB history fetch failed — keeping previous gb.json"
      # Coverage surface (#96): restate what the freshly-baked files actually
      # contain — the sidebar block and weg.coverage() both read this.
      - name: Rebuild coverage.json
        run: node scripts/build-coverage.mjs
      - name: Commit refreshed snapshots
        id: commit
        run: |
          git config user.name "grid-atlas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/live data/entsoe-maps || true
          if git diff --cached --quiet; then
            echo "No snapshot changes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: refresh European live snapshots"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      # Pushes made with GITHUB_TOKEN don't fire `on: push` workflows, so the
      # site would never pick up refreshed snapshots — dispatch the deploy.
      - name: Trigger site deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
