name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Coverage is report-only (#63): the summary lands in the job log so
      # drift is visible; thresholds can gate later once the floor settles.
      - run: npx vitest run --coverage
      - run: npm run build
      # e2e smoke (#63): boot the built site in the runner's Chrome and
      # assert the map renders — catches blank-map regressions.
      - run: node scripts/e2e-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
