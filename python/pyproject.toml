[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "world-energy-generation"
version = "0.2.0"
description = "Electricity generation, prices, flows and demand for 22 power grids across Europe and North America"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jacob Wright", email = "u.fourier123@gmail.com" }]
keywords = [
  "energy",
  "electricity",
  "power-grid",
  "generation",
  "carbon-intensity",
  "entsoe",
  "elexon",
  "ercot",
  "nyiso",
  "ieso",
  "open-data",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
# No runtime dependencies, on purpose. urllib and dataclasses are enough for
# four static JSON endpoints, and `pip install` should take a second.
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.5"]

[project.urls]
Homepage = "https://jacobwright32.github.io/uk-grid-atlas/"
Source = "https://github.com/jacobwright32/uk-grid-atlas"
Issues = "https://github.com/jacobwright32/uk-grid-atlas/issues"
Changelog = "https://github.com/jacobwright32/uk-grid-atlas/blob/main/python/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "pandas>=1.5",
  "ruff>=0.5",
  "mypy>=1.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/world_energy_generation"]

[tool.hatch.build.targets.sdist]
# Ship the tests and their fixtures: they are the only proof the parser matches
# the real published schema, and a downstream packager should be able to run them.
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["world_energy_generation"]
branch = true

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "F",    # pyflakes
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # bugbear
  "C4",   # comprehensions
  "SIM",  # simplify
  "RUF",
]
ignore = [
  "E501",    # line length is the formatter's job
  "B008",
  "RUF001",  # ambiguous unicode: the docs use en dashes deliberately
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into _parse and _get on purpose: the private seams are what let the
# suite run without a network, and testing only the public surface would leave the
# transport untested.
"tests/*" = ["SLF001", "B011"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
warn_unreachable = true
# pandas is optional, and typeshed's stubs for it are not a dependency we want.
ignore_missing_imports = true
# frames.py returns DataFrames as Any by design — typing them would make pandas a
# hard dependency of the type surface.
disallow_any_explicit = false
